name: views

# Build flux views that already contain flux-secretary, published under this
# repository's namespace. Jobs then install nothing: the secretary and its
# backend are resolved here, once, against the view's own interpreter.

on:
  pull_request:
  push:
    branches: [main, experiments]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - view: ghcr.io/converged-computing/flux-view-ubuntu:tag-noble
            tag: ubuntu-noble
          - view: ghcr.io/converged-computing/flux-view-ubuntu:tag-jammy
            tag: ubuntu-jammy
          #- view: ghcr.io/converged-computing/flux-view-rocky:tag-9
          #  tag: rocky-9
    steps:
      - uses: actions/checkout@v4

      - name: GHCR Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The import check inside the Dockerfile means a view whose Python cannot
      # satisfy the dependencies fails HERE, not in every job later.
      - name: Build ${{ matrix.tag }}
        run: |
          docker build -f views/Dockerfile \
            --build-arg view=${{ matrix.view }} \
            -t ghcr.io/converged-computing/flux-secretary:${{ matrix.tag }} .

      - name: Show what landed
        run: |
          docker run --rm ghcr.io/converged-computing/flux-secretary:${{ matrix.tag }} \
            flux python -c "import fluxsecretary, sys; print(sys.version); print(fluxsecretary.__file__)"

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/converged-computing/flux-secretary:${{ matrix.tag }}
